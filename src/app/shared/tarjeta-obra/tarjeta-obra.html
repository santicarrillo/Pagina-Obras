<article class="tarjeta">
  <a class="marco" [routerLink]="['/obra', obra().id]" [attr.aria-label]="obra().titulo">
    <img [src]="obra().imagenUrl" [alt]="obra().titulo" loading="lazy" />

    <!-- Solo en compu: al pasar el mouse -->
    <div class="hover" aria-hidden="true">
      <span class="tecnica">{{ obra().tecnica }}@if (obra().medidas) { · {{ obra().medidas }}}</span>
      @if (obra().descripcion) {
        <p class="descripcion">{{ obra().descripcion }}</p>
      }
      <span class="ver">Ver obra →</span>
    </div>
  </a>

  <div class="datos">
    <a class="titulo" [routerLink]="['/obra', obra().id]">{{ obra().titulo }}</a>
    <p class="precio">{{ precio(obra().precio) }}</p>
    @if (mostrarArtista()) {
      <a class="artista" [routerLink]="['/artista', obra().artistId]">{{ obra().artistaNombre }}</a>
    }
  </div>
</article>
