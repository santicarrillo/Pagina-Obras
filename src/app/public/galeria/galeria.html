<div class="galeria-page">
  <header class="topbar">
    <span class="brand">NICKART</span>
    <nav class="nav">
      <a routerLink="/obras">OBRAS</a>
      <span>SOBRE MÍ</span>
      <span>CONTACTO</span>
    </nav>
  </header>

  <main class="galeria-wrap">
    <div class="titulo-wrap">
      <p class="eyebrow">Colección completa</p>
      <h1>Obras</h1>
    </div>

    <section class="grid-obras">
      @for (obra of obras(); track obra.id) {
        <article class="tarjeta-obra" [routerLink]="['/obra', obra.id]">
          <div class="imagen" [style.background-image]="'url(' + obra.imagenUrl + ')'" aria-label="{{ obra.titulo }}"></div>
          <div class="meta">
            <h2>{{ obra.titulo }}</h2>
            <p>{{ obra.tecnica.toUpperCase() }}</p>
          </div>
        </article>
      }
    </section>
  </main>
</div>
