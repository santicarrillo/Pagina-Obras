@if (obra(); as obraActual) {
  <div class="detalle-page">
    <header class="topbar">
      <a routerLink="/obras" class="back-link">← Volver</a>
      <span class="brand">NICKART</span>
    </header>

    <main class="detalle-layout">
      <section class="obra-visual" aria-label="Detalle de la obra">
        <div class="obra-imagen" [style.background-image]="'url(' + obraActual.imagenUrl + ')'" role="img" [attr.aria-label]="obraActual.titulo"></div>
      </section>

      <article class="obra-info">
        <p class="eyebrow">{{ obraActual.tecnica.toUpperCase() }}</p>
        <h1>{{ obraActual.titulo }}</h1>

        <p class="descripcion">
          {{ obraActual.descripcion }}
        </p>

        <div class="precio-box">
          <span class="precio-label">Precio</span>
          <strong class="precio-valor">${{ obraActual.precio.toLocaleString('es-AR') }}</strong>
        </div>

        <div class="meta-grid">
          <div class="meta-item">
            <span>Año</span>
            <strong>{{ obraActual.anio }}</strong>
          </div>

          <div class="meta-item">
            <span>Medidas</span>
            <strong>{{ obraActual.medida }}</strong>
          </div>
        </div>

        <button class="cta-button" type="button" (click)="comprar()">
          Pagar con Mercado Pago
        </button>
      </article>
    </main>
  </div>
} @else {
  <div class="detalle-page loading-state">
    <p>Cargando obra...</p>
  </div>
}
