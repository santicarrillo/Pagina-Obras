@if (auth.cargando()) {
  <div class="app-loading-shell" aria-live="polite" aria-busy="true">
    <div class="app-loading-card">
      <div class="canvas-frame" aria-label="Cargando la página" role="status">
        <div class="canvas-border canvas-border-top"></div>
        <div class="canvas-border canvas-border-right"></div>
        <div class="canvas-border canvas-border-bottom"></div>
        <div class="canvas-border canvas-border-left"></div>
      </div>

      <div class="app-loading-copy">
        <span class="app-loading-kicker">Editorial</span>
        <p class="app-loading-text">Abriendo la colección</p>
      </div>
    </div>
  </div>
} @else {
  <header class="app-topbar">
    <div class="topbar-inner">
      <button class="brand-button" type="button" (click)="irAlHome()">
        NICKART
      </button>

      @if (mostrarNavegacion) {
        <nav class="topbar-nav" aria-label="Navegación principal">
          <a routerLink="/obras" routerLinkActive="activo">Galería</a>

          @if (esArtista) {
            <a routerLink="/admin/obras" routerLinkActive="activo">Mis obras</a>
          } @else {
            <a routerLink="/vender" routerLinkActive="activo">Quiero vender</a>
          }

          <a routerLink="/" fragment="contacto">Contacto</a>
        </nav>
      }

      <div class="topbar-right">
        @if (auth.estaLogueado()) {
          <div class="user-menu-wrap">
            <button class="user-button" type="button" (click)="alternarMenu()" aria-label="Abrir menú de usuario">
              @if (fotoUsuario) {
                <img class="user-avatar" [src]="fotoUsuario" alt="" referrerpolicy="no-referrer" />
              } @else {
                <span class="user-avatar">{{ inicialUsuario }}</span>
              }
              <span class="user-name">{{ nombreUsuario }}</span>
            </button>

            @if (menuAbierto()) {
              <div class="user-menu">
                <button type="button" class="menu-option" (click)="cerrarSesion()">
                  Cerrar sesión
                </button>
              </div>
            }
          </div>
        } @else {
          <button class="login-button" type="button" (click)="irALogin()">
            Iniciar sesión
          </button>
        }
      </div>
    </div>
  </header>

  <router-outlet></router-outlet>
}
